# ============================================================
# TourBooking - application.properties
# Cấu hình cho Tomcat 10.1.57 (external WAR deployment)
# ============================================================

# --- Database: SQL Server ---
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=TourBookingDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# --- Server ---
# Khi deploy WAR lên Tomcat 10.1.57: Tomcat tự quản lý port (mặc định 8080)
# Khi chạy trực tiếp trong IntelliJ (embedded): dùng port này
server.port=8080

# Context path khi deploy WAR:
# Nếu đặt tên file WAR là ROOT.war → context = /  → http://localhost:8080/api/tours
# Nếu đặt tên file WAR là tourbooking.war → context = /tourbooking → http://localhost:8080/tourbooking/api/tours
# Khuyến nghị: đổi tên WAR thành ROOT.war cho đơn giản
# server.servlet.context-path=/tourbooking

# --- JWT ---
app.jwt.secret=TourBookingNhom5SecretKey2024VeryLongSecretKeyForHS256Algorithm
app.jwt.expiration=86400000

# --- Mail (Gmail SMTP) ---
# Tạo App Password tại: https://myaccount.google.com/apppasswords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tourbooking.nhom5@gmail.com
spring.mail.password=your-app-password-here
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- File Upload ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads
