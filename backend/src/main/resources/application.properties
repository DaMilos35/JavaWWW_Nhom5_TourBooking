spring.application.name=tourbooking-api
spring.datasource.url=${DB_URL:jdbc:mariadb://127.0.0.1:3306/tourbookingdb?useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345678}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
server.port=8080
cors.allowed-origin=${CORS_ORIGIN:http://localhost:3000}
gemini.api.key=${GEMINI_API_KEY:}

# ==============================================================================
# TỐI ƯU HÓA HIKARICP CONNECTION POOLING (CHỊU TẢI CAO & GIẢM ĐỘ TRỄ)
# ==============================================================================
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:50}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=TourBookingHikariPool

# ==============================================================================
# HỆ THỐNG CACHING TẦNG 2 (LOCAL SIMPLE HOẶC REDIS TRONG DOCKER)
# ==============================================================================
spring.cache.type=${CACHE_TYPE:simple}

# ==============================================================================
# NÉN DỮ LIỆU ĐƯỜNG TRUYỀN (HTTP GZIP COMPRESSION)
# ==============================================================================
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024
