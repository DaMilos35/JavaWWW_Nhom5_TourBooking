# ==============================================================================
# CẤU HÌNH NGINX LOAD BALANCER & REVERSE PROXY CHỊU TẢI 1.000.000 CCU
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 100000;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 20000;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Định dạng Log hiệu năng cao
    log_format main_timed '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for" '
                          'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main_timed;

    # Tối ưu hóa I/O đường truyền mạng
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    reset_timedout_connection on;
    client_body_timeout 15;
    send_timeout 15;

    # Nén Gzip đa luồng
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Cụm Backend Spring Boot (Load Balancing Round-Robin & Keepalive)
    upstream backend_cluster {
        least_conn;
        server backend:8080 max_fails=3 fail_timeout=10s;
        keepalive 128;
    }

    # Micro-caching cho các API đọc tour (giảm 99% tải DB khi 1 triệu người cùng F5)
    proxy_cache_path /var/cache/nginx/api_cache levels=1:2 keys_zone=API_CACHE:50m max_size=1g inactive=10m use_temp_path=off;

    server {
        listen 80;
        server_name localhost;

        # 1. Frontend React SPA: Phục vụ trực tiếp file tĩnh siêu tốc
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;

            # Cache tài nguyên tĩnh (JS, CSS, Ảnh) 1 năm
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, max-age=31536000, immutable";
                access_log off;
            }
        }

        # 2. Reverse Proxy cho API Backend
        location /api/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Micro-cache cho các truy vấn GET danh sách tour & danh mục (5 giây)
            # Giúp hệ thống nuốt trọn 1.000.000 request/giây mà không làm Backend rung lắc
            proxy_cache API_CACHE;
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 5s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_connect_timeout 5s;
            proxy_send_timeout 20s;
            proxy_read_timeout 20s;
        }

        # 3. Healthcheck Endpoint
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
